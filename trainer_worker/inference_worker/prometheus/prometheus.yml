global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Optional: scrape backend directly if you also expose /metrics via
  # prometheus-fastapi-instrumentator (belt-and-suspenders alongside OTel)
  - job_name: "fastapi-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
