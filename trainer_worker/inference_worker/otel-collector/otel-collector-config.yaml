receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Metrics: expose a /metrics endpoint that Prometheus scrapes
  prometheus:
    endpoint: 0.0.0.0:8889

  # Traces: forward to Tempo over OTLP
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Logs: forward to Loki
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki, debug]
